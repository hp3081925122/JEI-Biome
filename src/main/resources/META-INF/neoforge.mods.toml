modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "jei_biome.mixins.json"
requiredMods = ["emi"]

[[mods]]
modId = "${mod_id}"
version = "${mod_full_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "required"
versionRange = "[19.39.0.368,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "emi"
type = "optional"
versionRange = "${emi_version_range}"
ordering = "AFTER"
side = "CLIENT"
