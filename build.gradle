plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

group = mod_group_id
version = "${minecraft_version}-fabric-${mod_version}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
    }
    ivy {
        name = 'EMI Modrinth CDN'
        url = "https://cdn.modrinth.com/data/${emi_modrinth_project_id}/versions/${emi_modrinth_version_id}"
        patternLayout {
            artifact '[artifact]-[revision].[ext]'
        }
        metadataSources {
            artifact()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly "mezz.jei:jei-${minecraft_version}-common:${jei_version}"
    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    modCompileOnly "modrinth.cdn:emi:${emi_version}"
    modRuntimeOnly "modrinth.cdn:emi:${emi_version}"
}

processResources {
    def replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            jei_version          : jei_version,
            emi_version          : emi_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_full_version     : project.version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
